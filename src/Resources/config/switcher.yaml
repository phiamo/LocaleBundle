parameters:
    lunetics_locale.switcher_helper.class: Lunetics\LocaleBundle\Templating\Helper\LocaleSwitchHelper
    lunetics_locale.twig.switcher.class: Lunetics\LocaleBundle\Twig\Extension\LocaleSwitcherExtension
    lunetics_locale.switcher_controller.class: Lunetics\LocaleBundle\Controller\LocaleController

services:
    lunetics_locale.switcher_helper:
        class: '%lunetics_locale.switcher_helper.class%'
        arguments:
            - '@twig'
            - '%lunetics_locale.switcher.template%'
        tags:
            - { name: templating.helper, alias: switch }

    lunetics_locale.twig.switcher:
        class: '%lunetics_locale.twig.switcher.class%'
        arguments:
            - '@lunetics_locale.switcher.target_information_builder'
            - '@lunetics_locale.switcher_helper'
        tags:
            - { name: twig.extension }

    lunetics_locale.switcher_controller:
        class: '%lunetics_locale.switcher_controller.class%'
        public: true
        arguments:
            - '@router'
            - '@lunetics_locale.validator.meta'
            - '%lunetics_locale.switcher.use_referrer%'
            - '%lunetics_locale.switcher.redirect_to_route%'
            - '%lunetics_locale.switcher.redirect_statuscode%'

    lunetics_locale.switcher.target_information_builder:
        class: Lunetics\LocaleBundle\Switcher\TargetInformationBuilder
        arguments:
            - '@request_stack'
            - '@router'
            - '@lunetics_locale.allowed_locales_provider'
            - '%lunetics_locale.switcher.show_current_locale%'
            - '%lunetics_locale.switcher.use_controller%'
