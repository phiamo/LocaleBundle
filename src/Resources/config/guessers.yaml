services:
    lunetics_locale.query_guesser:
        class: '%lunetics_locale.query_guesser.class%'
        arguments:
            - '@lunetics_locale.validator.meta'
            - '%lunetics_locale.query.parameter_name%'
        tags:
            - { name: lunetics_locale.guesser, alias: query }

    lunetics_locale.router_guesser:
        class: '%lunetics_locale.router_guesser.class%'
        arguments:
            - '@lunetics_locale.validator.meta'
        tags:
            - { name: lunetics_locale.guesser, alias: router }

    lunetics_locale.browser_guesser:
        class: '%lunetics_locale.browser_guesser.class%'
        arguments:
            - '@lunetics_locale.validator.meta'
        tags:
            - { name: lunetics_locale.guesser, alias: browser }

    lunetics_locale.cookie_guesser:
        class: '%lunetics_locale.cookie_guesser.class%'
        arguments:
            - '@lunetics_locale.validator.meta'
            - '%lunetics_locale.cookie.name%'
        tags:
            - { name: lunetics_locale.guesser, alias: cookie }

    lunetics_locale.session_guesser:
        class: '%lunetics_locale.session_guesser.class%'
        arguments:
            - '@session'
            - '@lunetics_locale.validator.meta'
            - '%lunetics_locale.session.variable%'
        tags:
            - { name: lunetics_locale.guesser, alias: session }

    lunetics_locale.subdomain_guesser:
        class: '%lunetics_locale.subdomain_guesser.class%'
        arguments:
            - '@lunetics_locale.validator.meta'
            - '%lunetics_locale.subdomain.region_separator%'
        tags:
            - { name: lunetics_locale.guesser, alias: subdomain }

    lunetics_locale.topleveldomain_guesser:
        class: '%lunetics_locale.topleveldomain_guesser.class%'
        arguments:
            - '@lunetics_locale.validator.meta'
            - '@lunetics_locale.topleveldomain_locale_map'
        tags:
            - { name: lunetics_locale.guesser, alias: topleveldomain }

    lunetics_locale.domain_guesser:
        class: '%lunetics_locale.domain_guesser.class%'
        arguments:
            - '@lunetics_locale.validator.meta'
            - '@lunetics_locale.domain_locale_map'
        tags:
            - { name: lunetics_locale.guesser, alias: domain }
